version: "3"
interval: 500ms
tasks:
  default:
    cmds:
      - task: env-reload
  env-reload:
    cmds:
      - direnv reload
      - nix-direnv-reload
    aliases:
      - env
  run:
    cmds:
      - roc dev src/main.roc --profiling
    method: none
    #  debug:
    #    deps:
    #      - build-debug
    #    cmds:
    #      - gdb debug/main --tui
    #    aliases:
    #      - d
    #    method: none
    #  debug-dap:
    #    cmds:
    #      - gdb debug/main -i dap
    #    method: none
  mkdir-bin:
    precondition: "[ ! -e bin ]"
    sources:
      - "bin/"
    cmds:
      - mkdir bin
    internal: true
  build:
    deps:
      - mkdir-bin
    sources:
      - "src/**/*.roc"
    cmds:
      - roc build src/main.roc --output bin/main
    aliases:
      - b
    generates:
      - bin/main
  build-test:
    sources:
      - "src/**/*.roc"
    cmds:
      - roc test src/main.roc --profiling
    aliases:
      - test
    method: none
  mkdir-debug:
    precondition: "[ ! -e debug ]"
    sources:
      - "debug/"
    cmds:
      - mkdir debug
    internal: true
  build-debug:
    deps:
      - mkdir-debug
    sources:
      - "src/**/*.roc"
    cmds:
      - roc build src/main.roc --output bin/main --dev --profiling
    aliases:
      - bd
    generates:
      - debug/main
  watch:
    watch: true
    sources:
      - "src/**/*.roc"
    cmds:
      - task: test
  watch-run:
    watch: true
    sources:
      - "src/**/*.roc"
    cmds:
      - task: run
