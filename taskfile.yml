version: "3"
interval: 500ms
tasks:
  default:
    cmds:
      - task: env-reload
  env-reload:
    cmds:
      - direnv reload
      - nix-direnv-reload
    aliases:
      - env
  run:
    deps:
      - build
    cmds:
      - nix run .
  debug:
    deps:
      - build-debug
    cmds:
      - gdb debug/main --tui
    aliases:
      - d
  debug-dap:
    cmds:
      - gdb debug/main -i dap
  build:
    cmds:
      - nix build .
    aliases:
      - b
  build-test:
    cmds:
      - odin test src/main/ -out:debug/main -o:none -all-packages
      - nix run .
    aliases:
      - test
  mkdir-debug:
    sources:
      - "debug/"
    cmds:
      - rm -r debug
      - mkdir debug
    internal: true
  build-debug:
    deps:
      - mkdir-debug
    sources:
      - "src/**/*.odin"
    cmds:
      - odin build src/main -out:debug/main -o:none -debug
    aliases:
      - bd
    generates:
      - debug/main
  watch:
    watch: true
    sources:
      - "src/**/*.odin"
    cmds:
      - task: test
  watch-run:
    sources:
      - "src/**/*.odin"
    cmds:
      - task: run
